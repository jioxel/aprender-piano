<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>aprender-piano</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side routing, so a direct link to a route like
      // /aprender-piano/nivel/nivel-1 404s. This encodes the path into a query string
      // and redirects to index.html, which decodes it back before React Router mounts.
      // See https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
